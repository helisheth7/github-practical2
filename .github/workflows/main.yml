name: Collaborative Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Update index.html
        if: github.actor == 'helisheth7'
        run: sed -i '/<\/body>/i <p>Updated by Team Leader on '"$(11/11/2026)"'</p>' index.html

